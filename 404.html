<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 – Level nicht gefunden · Zockbox</title>
  <meta name="theme-color" content="#d8a96a">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages zeigt diese Seite für jeden falschen Pfad – egal wie tief.
    // Damit CSS und Links stimmen, setzen wir die Basis auf den Projektordner
    // (https://oskar26.github.io/zockbox/ → Basis "/zockbox/"). Lokal: "/".
    (function () {
      var p = location.pathname.split('/');
      var base = location.hostname.endsWith('github.io') && p.length > 2 && p[1] ? '/' + p[1] + '/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="shared/zockbox.css">
</head>
<body class="zx">
  <header class="zx-top">
    <div class="zx-wrap zx-top-in">
      <a class="zx-brand" href="./" aria-label="Zockbox Startseite">
        <span class="zx-logo" aria-hidden="true">Z</span>
        <span class="zx-brand-txt">Zockbox</span>
      </a>
    </div>
  </header>

  <main class="zx-wrap zx-404">
    <div>
      <div class="zx-404-big" aria-hidden="true">404</div>
      <h1>Level nicht gefunden</h1>
      <p>Diese Kiste ist leer – vielleicht ein Tippfehler im Link. Du wolltest einer Lobby beitreten? Gib den Code auf der Startseite ein.</p>
      <a class="zx-btn" href="./">Zur Zockbox</a>
    </div>
  </main>

  <footer class="zx-foot">
    <div class="zx-wrap">
      <div class="zx-sig">made by <b>Oskar</b></div>
      <p class="zx-foot-note">Zum Spaß mit Freunden. Bitte halte dich an die Regeln deiner Schule.</p>
    </div>
  </footer>
</body>
</html>
